services:
  mysql:
    image: mysql:8.0
    container_name: cloud-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloud-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:6
    container_name: cloud-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: cloud-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "18848:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root123
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_DATABASE_NUM: 1
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_TOKEN: VGhpc0lzQVNlY3JldEtleUZvck5hY29zQXV0aGVudGljYXRpb25Ub2tlbkVuY3J5cHRpb24=
      NACOS_AUTH_IDENTITY_KEY: Y29udGFpbmVySWRlbnRpdHlLZXk=
      NACOS_AUTH_IDENTITY_VALUE: Y29udGFpbmVySWRlbnRpdHlWYWx1ZQ==
    volumes:
      - nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy

  emqx:
    image: emqx/emqx:5.8.6
    container_name: cloud-emqx
    restart: always
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  tdengine:
    image: tdengine/tsdb:3.4.1.13
    container_name: cloud-tdengine
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        taosd &
        until taos -s 'SELECT server_version()' 2>/dev/null; do sleep 1; done
        sh /docker-entrypoint-initdb.d/init.sh
        wait
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6060:6060"
    environment:
      TAOS_FQDN: "tdengine"
      TAOS_ROOT_PASSWORD: "taosdata"
      EXPLORER_SKIP_REGISTER: true
    volumes:
      - tdengine_data:/var/lib/taos
      - ./tdengine-init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./explorer-register.cfg:/etc/taos/explorer-register.cfg

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  nacos_logs:
  emqx_data:
  emqx_log:
  tdengine_data:
